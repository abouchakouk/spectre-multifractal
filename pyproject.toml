[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectre"
version = "0.1.0"
description = "Environnement contrôlé pour l'estimation du spectre multifractal D(h) sous bruit additif"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "PyWavelets"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
